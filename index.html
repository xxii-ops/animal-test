<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f3eee7">
<title>动物人格测试｜你的灵魂是什么小动物？</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang SC",
        "Hiragino Sans GB",
        "Microsoft YaHei",
        sans-serif;
    background:#eee9e2;
    color:#332d28;
    overflow-x:hidden;
}

button,input{
    font-family:inherit;
}

button{
    cursor:pointer;
}

/* ================= 背景 ================= */

.page{
    position:relative;
    min-height:100vh;
    overflow:hidden;
}

.page::before{
    content:"";
    position:fixed;
    width:500px;
    height:500px;
    border-radius:50%;
    background:rgba(182,158,130,.13);
    filter:blur(80px);
    top:-180px;
    left:-160px;
    pointer-events:none;
}

.page::after{
    content:"";
    position:fixed;
    width:420px;
    height:420px;
    border-radius:50%;
    background:rgba(130,115,100,.10);
    filter:blur(90px);
    right:-160px;
    bottom:-130px;
    pointer-events:none;
}

/* ================= 通用 ================= */

.screen{
    display:none;
    min-height:100vh;
    position:relative;
    z-index:2;
}

.screen.active{
    display:flex;
}

.container{
    width:min(900px,92%);
    margin:auto;
}

/* ================= 密码页 ================= */

#passwordPage{
    align-items:center;
    justify-content:center;
    text-align:center;
}

.password-card{
    width:min(500px,92%);
    padding:58px 34px 50px;
    background:rgba(255,255,255,.58);
    border:1px solid rgba(110,95,80,.16);
    border-radius:28px;
    box-shadow:
        0 25px 70px rgba(75,60,45,.12),
        inset 0 1px 0 rgba(255,255,255,.8);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
}

.logo-small{
    font-size:13px;
    letter-spacing:5px;
    color:#88796b;
    margin-bottom:25px;
}

.paw{
    font-size:52px;
    margin-bottom:22px;
}

.password-card h1{
    font-family:Georgia,"Times New Roman",serif;
    font-size:35px;
    font-weight:400;
    letter-spacing:2px;
    margin-bottom:12px;
}

.password-card .subtitle{
    color:#8b8178;
    font-size:13px;
    letter-spacing:2px;
    margin-bottom:38px;
}

.code-input{
    width:100%;
    height:60px;
    border:1px solid #d7cec3;
    background:rgba(255,255,255,.72);
    border-radius:15px;
    text-align:center;
    font-size:24px;
    letter-spacing:12px;
    color:#443a32;
    outline:none;
    transition:.3s;
    position:relative;
    z-index:10;
    pointer-events:auto;
    user-select:text;
    -webkit-user-select:text;
}

.code-input:focus{
    border-color:#9b8978;
    box-shadow:0 0 0 4px rgba(155,137,120,.1);
}

.enter-btn,
.start-btn,
.next-btn,
.restart-btn{
    border:none;
    background:#40372f;
    color:white;
    height:56px;
    border-radius:15px;
    width:100%;
    font-size:14px;
    letter-spacing:4px;
    margin-top:16px;
    transition:.3s;
}

.enter-btn:hover,
.start-btn:hover,
.next-btn:hover,
.restart-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 25px rgba(60,50,40,.18);
}

.error{
    height:20px;
    margin-top:13px;
    color:#a55d52;
    font-size:13px;
}

/* ================= 开始页 ================= */

#introPage{
    align-items:center;
}

.intro{
    text-align:center;
    padding:60px 0;
}

.eyebrow{
    font-size:11px;
    letter-spacing:6px;
    color:#8f8173;
    margin-bottom:24px;
}

.intro-animal{
    font-size:78px;
    margin-bottom:20px;
    animation:float 4s ease-in-out infinite;
}

@keyframes float{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-10px)}
}

.intro h1{
    font-family:Georgia,"Times New Roman",serif;
    font-weight:400;
    font-size:clamp(38px,7vw,68px);
    letter-spacing:3px;
    line-height:1.15;
    margin-bottom:20px;
}

.intro-description{
    max-width:560px;
    margin:0 auto;
    line-height:2;
    color:#766c63;
    font-size:14px;
}

.intro-line{
    width:50px;
    height:1px;
    background:#a89887;
    margin:35px auto;
}

.info-row{
    display:flex;
    justify-content:center;
    gap:45px;
    color:#8a7d70;
    font-size:12px;
    letter-spacing:2px;
}

.start-btn{
    max-width:280px;
    margin-top:40px;
}

/* ================= 测试页 ================= */

#quizPage{
    align-items:center;
}

.quiz-wrap{
    width:min(760px,92%);
    margin:auto;
    padding:50px 0;
}

.quiz-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
    color:#8d8073;
    font-size:12px;
    letter-spacing:2px;
}

.progress{
    width:100%;
    height:3px;
    background:#d8d0c7;
    border-radius:10px;
    overflow:hidden;
    margin-bottom:50px;
}

.progress-bar{
    height:100%;
    background:#6f6256;
    width:0%;
    transition:.5s ease;
}

.question-number{
    font-family:Georgia,"Times New Roman",serif;
    font-size:14px;
    color:#a08f7f;
    margin-bottom:18px;
}

.question{
    font-size:clamp(23px,4vw,34px);
    line-height:1.55;
    font-weight:400;
    margin-bottom:38px;
}

.options{
    display:flex;
    flex-direction:column;
    gap:13px;
}

.option{
    position:relative;
    border:1px solid #d7cec4;
    background:rgba(255,255,255,.5);
    border-radius:16px;
    padding:19px 20px;
    min-height:62px;
    text-align:left;
    color:#50473f;
    font-size:14px;
    line-height:1.7;
    transition:.25s;
}

.option:hover{
    border-color:#9d8c7b;
    background:rgba(255,255,255,.82);
    transform:translateX(4px);
}

.option.selected{
    border-color:#64564a;
    background:#5a4d43;
    color:#fff;
    box-shadow:0 10px 25px rgba(70,55,45,.15);
}

.option-letter{
    display:inline-flex;
    width:28px;
    height:28px;
    align-items:center;
    justify-content:center;
    border:1px solid currentColor;
    border-radius:50%;
    margin-right:12px;
    font-size:11px;
    opacity:.7;
}

.next-btn{
    margin-top:30px;
    display:none;
}

.next-btn.show{
    display:block;
}

/* ================= 结果页 ================= */

#resultPage{
    align-items:flex-start;
}

.result-wrap{
    width:min(900px,92%);
    margin:auto;
    padding:55px 0 70px;
}

.result-header{
    text-align:center;
    margin-bottom:38px;
}

.result-small{
    color:#97887a;
    letter-spacing:5px;
    font-size:10px;
    margin-bottom:22px;
}

.result-animal{
    font-size:100px;
    margin-bottom:10px;
    animation:resultPop .8s ease;
}

@keyframes resultPop{
    0%{
        opacity:0;
        transform:scale(.7) translateY(20px);
    }
    100%{
        opacity:1;
        transform:scale(1) translateY(0);
    }
}

.result-header h1{
    font-family:Georgia,"Times New Roman",serif;
    font-size:clamp(38px,7vw,65px);
    font-weight:400;
    letter-spacing:2px;
    margin-bottom:8px;
}

.result-en{
    font-size:11px;
    letter-spacing:5px;
    color:#9b8c7e;
}

.result-card{
    background:rgba(255,255,255,.58);
    border:1px solid rgba(110,95,80,.15);
    border-radius:28px;
    padding:42px;
    box-shadow:0 25px 70px rgba(75,60,45,.10);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
}

.result-intro{
    text-align:center;
    font-size:16px;
    line-height:2.1;
    color:#625950;
    max-width:700px;
    margin:0 auto 38px;
}

.divider{
    width:100%;
    height:1px;
    background:#ded6cd;
    margin:30px 0;
}

.section-title{
    font-family:Georgia,"Times New Roman",serif;
    font-size:22px;
    font-weight:400;
    margin-bottom:23px;
}

.tags{
    display:flex;
    flex-wrap:wrap;
    gap:9px;
    margin-bottom:32px;
}

.tag{
    padding:8px 14px;
    border-radius:30px;
    background:#ece5dd;
    color:#76685b;
    font-size:12px;
}

.traits{
    display:flex;
    flex-direction:column;
    gap:19px;
    margin-bottom:35px;
}

.trait-row{
    display:grid;
    grid-template-columns:85px 1fr 40px;
    align-items:center;
    gap:14px;
    font-size:12px;
    color:#75695e;
}

.trait-bar{
    height:7px;
    border-radius:10px;
    background:#e2dbd3;
    overflow:hidden;
}

.trait-fill{
    height:100%;
    width:0;
    background:#756558;
    border-radius:10px;
    animation:barIn 1.2s ease forwards;
}

@keyframes barIn{
    from{width:0}
}

.love-box{
    background:#f0ebe5;
    border-radius:18px;
    padding:25px;
    margin-bottom:25px;
}

.love-box h3{
    font-size:13px;
    letter-spacing:2px;
    margin-bottom:12px;
}

.love-box p{
    color:#71665d;
    font-size:13px;
    line-height:2;
}

.quote{
    text-align:center;
    padding:20px 10px;
    font-family:Georgia,"Times New Roman",serif;
    font-size:20px;
    line-height:1.8;
    color:#51473f;
}

.result-actions{
    display:flex;
    gap:12px;
    margin-top:25px;
}

.result-actions button{
    flex:1;
}

.share-btn{
    height:55px;
    border-radius:15px;
    border:1px solid #cfc4b9;
    background:rgba(255,255,255,.6);
    color:#665a50;
    letter-spacing:2px;
}

.restart-btn{
    margin-top:0;
}

/* ================= 手机 ================= */

@media(max-width:600px){

    .password-card{
        padding:45px 22px 38px;
    }

    .password-card h1{
        font-size:28px;
    }

    .intro{
        padding:40px 0;
    }

    .intro-animal{
        font-size:65px;
    }

    .intro h1{
        font-size:38px;
    }

    .info-row{
        gap:20px;
    }

    .quiz-wrap{
        padding:35px 0 45px;
    }

    .progress{
        margin-bottom:35px;
    }

    .question{
        font-size:23px;
        margin-bottom:28px;
    }

    .option{
        padding:16px 14px;
    }

    .result-wrap{
        padding:35px 0 50px;
    }

    .result-animal{
        font-size:75px;
    }

    .result-card{
        padding:25px 20px;
        border-radius:22px;
    }

    .result-intro{
        font-size:14px;
    }

    .trait-row{
        grid-template-columns:65px 1fr 35px;
        gap:8px;
    }

    .result-actions{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<div class="page">

<!-- ================= 密码页 ================= -->

<section id="passwordPage" class="screen active">

    <div class="password-card">

        <div class="logo-small">SOUL ANIMAL ARCHIVE</div>

        <div class="paw">🐾</div>

        <h1>灵魂动物档案</h1>

        <div class="subtitle">ENTER YOUR ACCESS CODE</div>

        <input
            id="codeInput"
            class="code-input"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            maxlength="4"
            placeholder="••••"
        >

        <button id="enterBtn" class="enter-btn">
            开启测试
        </button>

        <div id="errorText" class="error"></div>

    </div>

</section>


<!-- ================= 首页 ================= -->

<section id="introPage" class="screen">

    <div class="container">

        <div class="intro">

            <div class="eyebrow">
                SOUL ANIMAL PERSONALITY TEST
            </div>

            <div class="intro-animal">🐾</div>

            <h1>
                你的灵魂<br>
                是什么小动物？
            </h1>

            <p class="intro-description">
                如果把你的性格、情绪、爱情观和隐藏的一面，
                全部变成一种小动物……
                <br>
                你会是什么？
            </p>

            <div class="intro-line"></div>

            <div class="info-row">
                <span>18 QUESTIONS</span>
                <span>12 ANIMALS</span>
                <span>≈ 3 MIN</span>
            </div>

            <button id="startBtn" class="start-btn">
                开始探索我的灵魂
            </button>

        </div>

    </div>

</section>


<!-- ================= 测试页 ================= -->

<section id="quizPage" class="screen">

    <div class="quiz-wrap">

        <div class="quiz-top">
            <span>SOUL ANIMAL</span>
            <span id="progressText">01 / 18</span>
        </div>

        <div class="progress">
            <div id="progressBar" class="progress-bar"></div>
        </div>

        <div id="questionNumber" class="question-number">
            QUESTION 01
        </div>

        <div id="questionText" class="question"></div>

        <div id="options" class="options"></div>

        <button id="nextBtn" class="next-btn">
            下一题
        </button>

    </div>

</section>


<!-- ================= 结果页 ================= -->

<section id="resultPage" class="screen">

    <div class="result-wrap">

        <div class="result-header">

            <div class="result-small">
                YOUR SOUL ANIMAL IS
            </div>

            <div id="resultAnimal" class="result-animal"></div>

            <h1 id="resultName"></h1>

            <div id="resultEn" class="result-en"></div>

        </div>

        <div class="result-card">

            <p id="resultIntro" class="result-intro"></p>

            <div class="divider"></div>

            <h2 class="section-title">
                你的灵魂关键词
            </h2>

            <div id="resultTags" class="tags"></div>

            <h2 class="section-title">
                人格倾向
            </h2>

            <div id="traits" class="traits"></div>

            <div class="love-box">

                <h3>你的相处方式</h3>

                <p id="resultLove"></p>

            </div>

                <p id="resultHidden"></p>

        </div>

        <div class="result-actions">

            <button id="shareBtn" class="share-btn">
                复制我的结果
            </button>

            <button id="restartBtn" class="restart-btn">
                重新测试
            </button>

        </div>

    </div>

</section>

</div>
<script>

/* =========================================================
   基础设置
========================================================= */

const ACCESS_CODE = "2121";

const screens = {
    password: document.getElementById("passwordPage"),
    intro: document.getElementById("introPage"),
    quiz: document.getElementById("quizPage"),
    result: document.getElementById("resultPage")
};

function showScreen(name){

    Object.values(screens).forEach(screen=>{
        screen.classList.remove("active");
    });

    screens[name].classList.add("active");

    window.scrollTo({
        top:0,
        behavior:"instant"
    });
}


/* =========================================================
   密码
========================================================= */

const codeInput = document.getElementById("codeInput");
const enterBtn = document.getElementById("enterBtn");
const errorText = document.getElementById("errorText");

function checkCode(){

    const value = codeInput.value.trim();

    if(value === ACCESS_CODE){

        errorText.textContent = "";

        showScreen("intro");

    }else{

        errorText.textContent = "提取码不正确，请重新输入";

        codeInput.value = "";

        codeInput.focus();

    }
}

enterBtn.addEventListener("click",checkCode);

codeInput.addEventListener("keydown",function(e){

    if(e.key === "Enter"){
        checkCode();
    }

});


/* =========================================================
   12种动物人格
========================================================= */

const animals = [

{

    tags:["慢热","边界感","敏感","嘴硬心软"],

    },

    love:"你需要的是一种舒服的关系。不是时时刻刻黏在一起，而是即使彼此安静，也知道对方没有离开。你不太擅长直接说“我想你”，却会用很多细节表达在乎。",

    hidden:"越是在乎的人面前，你反而越容易变得幼稚。嘴上说着随便，其实对方一句话都可能在你心里反复播放很多遍。",

    quote:"“我不是不需要你，我只是希望你愿意主动走近我。”"
},

{
    id:"dog",

    en:"THE PUPPY",

    intro:"你的灵魂是一只小狗。你拥有非常直接而热烈的情感，喜欢一个人就是喜欢，不太愿意绕太多弯。你愿意陪伴，也很珍惜被坚定选择的感觉。",

    tags:["热烈","忠诚","直球","陪伴"],

    traits:{
        "敏感度":78,
        "独立性":61,
        "依赖感":94,
        "浪漫度":86
    },

    love:"你在关系里非常看重回应。对方愿意告诉你发生了什么、愿意分享生活，你就会获得很大的安全感。你真正需要的不是轰轰烈烈，而是“我一直都在”。",

    hidden:"你看起来很好哄，其实最难过的时候反而不会说。你越喜欢一个人，越容易把对方的一点点冷淡放大。",

    quote:"“喜欢一个人，就是想把今天遇到的所有小事都告诉你。”"
},

{
    id:"fox",
    name:"狐狸",

    emoji:"🦊",

    intro:"你的灵魂是一只狐狸。聪明、敏锐、会观察，也非常懂得保护自己。你很少因为一时冲动进入一段关系，而是会默默观察对方很久。",

        "敏感度":86,

    },

    love:"你喜欢有脑子、有趣、有分寸的人。你不喜欢被控制，更不喜欢别人试图强行进入你的私人世界。真正让你心动的，是一个懂得尊重你边界的人。",

    quote:"“我看起来什么都知道，其实只是因为我太害怕看错人。”"

{

{

/* =========================================================
   测试逻辑
========================================================= */

let currentQuestion = 0;
let answers = [];

const questionText = document.getElementById("questionText");
const questionNumber = document.getElementById("questionNumber");
const optionsBox = document.getElementById("options");
const nextBtn = document.getElementById("nextBtn");
const progressBar = document.getElementById("progressBar");
const progressText = document.getElementById("progressText");


function startQuiz(){

    currentQuestion = 0;
    answers = [];

    showScreen("quiz");

    renderQuestion();
}


document.getElementById("startBtn")
.addEventListener("click",startQuiz);


function renderQuestion(){

    const q = questions[currentQuestion];

    questionNumber.textContent =
        "QUESTION " +
        String(currentQuestion + 1).padStart(2,"0");

    progressText.textContent =
        String(currentQuestion + 1).padStart(2,"0")
        + " / "
        + String(questions.length).padStart(2,"0");

    progressBar.style.width =
        ((currentQuestion) / questions.length * 100) + "%";

    questionText.textContent = q.text;

    optionsBox.innerHTML = "";

    nextBtn.classList.remove("show");

    q.options.forEach((option,index)=>{

        const button = document.createElement("button");

        button.className = "option";

        button.innerHTML =
            `<span class="option-letter">${option[0]}</span>${option[1]}`;

        button.addEventListener("click",()=>{

            document
                .querySelectorAll(".option")
                .forEach(item=>item.classList.remove("selected"));

            button.classList.add("selected");

            answers[currentQuestion] = index;

            nextBtn.classList.add("show");

        });

        optionsBox.appendChild(button);

    });
}


nextBtn.addEventListener("click",()=>{

    if(answers[currentQuestion] === undefined){
        return;
    }

    currentQuestion++;

    if(currentQuestion >= questions.length){

        calculateResult();

    }else{

        renderQuestion();

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }

});

/* =========================================================

========================================================= */

function showResult(animal,scores){

    showScreen("result");

    document.getElementById("resultAnimal").textContent =
        animal.emoji;

    document.getElementById("resultName").textContent =
        animal.name;

    document.getElementById("resultEn").textContent =
        animal.en;

    document.getElementById("resultIntro").textContent =
        animal.intro;

    document.getElementById("resultLove").textContent =
        animal.love;

    document.getElementById("resultHidden").textContent =
        animal.hidden;

    document.getElementById("resultQuote").textContent =
        animal.quote;


    const tags =
        document.getElementById("resultTags");

    tags.innerHTML = "";

    animal.tags.forEach(tag=>{

        const span = document.createElement("span");

        span.className = "tag";

        span.textContent = tag;

        tags.appendChild(span);

    });


    const traits =
        document.getElementById("traits");

    traits.innerHTML = "";

    Object.entries(animal.traits).forEach(([name,value])=>{

        const row = document.createElement("div");

        row.className = "trait-row";

        row.innerHTML = `
            <span>${name}</span>
            <div class="trait-bar">
                <div class="trait-fill" style="width:${value}%"></div>
            </div>
            <span>${value}</span>
        `;

        traits.appendChild(row);

    });


    /*
       保存当前结果，
       方便复制。
    */

    window.currentAnimal = animal;

}
